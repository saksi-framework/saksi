syntax = "proto3";

package saksi.protocol.v1;

option go_package = "github.com/saksi-framework/saksi/packages/saksi-protocol/go/saksiprotocolv1;saksiprotocolv1";

message Ciphertext {
  uint32 version = 1;
  bytes pad = 2;
  bytes data = 3;
}

message ChaumPedersenProof {
  uint32 version = 1;
  bytes commitment_a = 2;
  bytes commitment_b = 3;
  bytes challenge = 4;
  bytes response = 5;
}

message CDSProofBranch {
  bytes commitment_a = 1;
  bytes commitment_b = 2;
  bytes challenge = 3;
  bytes response = 4;
}

message CDSProof {
  uint32 version = 1;
  repeated CDSProofBranch branches = 2;
}

message PedersenCommitment {
  uint32 version = 1;
  bytes commitment = 2;
  bytes opening = 3;
}

message Nullifier {
  uint32 version = 1;
  bytes value = 2;
}

message CredentialPresentation {
  uint32 version = 1;
  bytes credential_commitment = 2;
  bytes issuer_public_key = 3;
  bytes presentation_proof = 4;
  Nullifier nullifier = 5;
}

message Ballot {
  uint32 version = 1;
  string election_id = 2;
  bytes voter_credential_commitment = 3;
  repeated Ciphertext ciphertexts = 4;
  repeated CDSProof well_formedness_proofs = 5;
  CredentialPresentation credential_presentation = 6;
  // Position this ballot record votes in (one record per voter per position;
  // ADR-0007 / R2). The ciphertexts/proofs cover exactly this position's
  // candidate contests — the election-wide contest_ids are position-qualified
  // ("<position_id>/<candidate_idx>"), and the nullifier is
  // PRF(s_cred, election_id || position_id) so double voting is prevented per
  // voter per position. Empty on a legacy single-position ballot.
  string position_id = 7;
}

message TrusteeCommitment {
  string trustee_id = 1;
  repeated bytes coefficient_commitments = 2;
}

message DKGComplaint {
  string complainant_id = 1;
  string accused_id = 2;
  string reason = 3;
}

message DKGTranscript {
  uint32 version = 1;
  string election_id = 2;
  uint32 threshold = 3;
  repeated TrusteeCommitment trustee_commitments = 4;
  repeated DKGComplaint complaints = 5;
}

message PartialDecryption {
  uint32 version = 1;
  string trustee_id = 2;
  bytes share = 3;
  ChaumPedersenProof proof = 4;
  // Identifies which contest's homomorphic ciphertext this share decrypts, so
  // on-chain partial decryptions are self-describing rather than relying on a
  // positional contest-major layout.
  string contest_id = 5;
}

// A trustee's signature over a published TallyResult: proof that the trustee
// holding DKG share s_i endorses exactly these totals for this election.
//
// `signature` is the 64-byte canonical Schnorr proof (compressed commitment ‖
// scalar) of knowledge of s_i such that `trustee_public_share = s_i·G`, taken
// over the context
//   b"saksi.tally.sig.v1" || election_id || totals[0..n] as little-endian u64s
// The context carries NO length prefixes, so distinct (election_id, totals)
// pairs could collide if the election id were attacker-chosen: its safety rests
// on the id being fixed by the deployment at election creation. A v2 domain
// should length-prefix the id instead of relying on that.
//
// The verification key is derived from the DKG transcript alone:
//   vk_i = Σ_j Σ_k C_{j,k} · i^k
// over every dealer's `coefficient_commitments`, where `i` is the trustee's
// **1-based position in ElectionParameters.trustee_ids**, never a number parsed
// out of `trustee_id` (ids are opaque labels). The DKG evaluates dealer
// polynomials at exactly those positions, 1..n.
message TrusteeSignature {
  string trustee_id = 1;
  bytes signature = 2;
}

message TallyResult {
  uint32 version = 1;
  string election_id = 2;
  repeated uint64 totals = 3;
  repeated PartialDecryption partial_decryptions = 4;
  // One entry per trustee, in trustee order. Empty on a tally published before
  // trustee signatures existed; the auditor treats that as a failure.
  repeated TrusteeSignature signatures = 5;
}

message ElectionParameters {
  uint32 version = 1;
  string election_id = 2;
  repeated string contest_ids = 3;
  repeated string trustee_ids = 4;
  uint32 threshold = 5;
}

