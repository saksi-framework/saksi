<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research Election Console</title>
<style>
  :root {
    --bg:#f4f6f8; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#181b20; --muted:#5c6470;
    --line:#e4e8ec; --line-2:#eef1f4; --accent:#2f6fed; --accent-weak:#e8effe; --accent-ink:#1a4ed0;
    --ok:#17864a; --ok-weak:#e3f4ea; --bad:#c53434; --bad-weak:#fbe9e9;
    --logbg:#0e1116; --logink:#d6dae0;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.04);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0c0e11; --panel:#15181d; --panel-2:#181c22; --ink:#e8ebef; --muted:#98a1ad;
      --line:#262b32; --line-2:#20242a; --accent:#5b8bff; --accent-weak:#1a2740; --accent-ink:#a9c4ff;
      --ok:#4cc47f; --ok-weak:#132a1f; --bad:#f0736f; --bad-weak:#301a1c;
      --logbg:#05070a; --logink:#c8ccd2;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
    }
  }
  * { box-sizing:border-box; }
  html { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  ::selection { background:var(--accent); color:#fff; }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:8px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--muted); background-clip:content-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  .tnum { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

  header { padding:20px 28px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; font-weight:650; letter-spacing:-0.02em; }
  header .sub { color:var(--muted); font-size:12px; }
  header .tag { margin-left:auto; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
                color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 10px; }

  main { display:grid; grid-template-columns:340px minmax(0,1fr); gap:22px;
         padding:24px 28px 40px; max-width:1240px; margin:0 auto; align-items:start; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
           padding:18px 18px 20px; box-shadow:var(--shadow); }
  .col-run { display:flex; flex-direction:column; gap:22px; min-width:0; }
  .full { grid-column:1 / -1; }
  @media (max-width:900px){ .full{ grid-column:auto; } }

  .phead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
  h2 { margin:0; font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .meta { font-size:12px; color:var(--muted); font-family:var(--mono); }

  label { display:block; font-size:12px; color:var(--muted); margin:13px 0 5px; font-weight:500; }
  input, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm);
                  background:var(--panel-2); color:var(--ink); font:inherit; transition:border-color .12s, box-shadow .12s; }
  input:hover, select:hover { border-color:#cdd4dc; }
  input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  input:disabled { color:var(--muted); background:var(--line-2); }
  .row { display:flex; gap:10px; } .row > div { flex:1; min-width:0; }

  .trustee { display:flex; gap:8px; align-items:center; margin:7px 0; }
  .trustee input { flex:1; }

  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink);
           padding:8px 13px; border-radius:var(--radius-sm); cursor:pointer;
           transition:border-color .12s, background .12s, color .12s; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover:not(:disabled) { background:var(--accent-ink); border-color:var(--accent-ink); color:#fff; }
  button.small { padding:5px 10px; font-size:12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }

  .presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .presets button { padding:4px 10px; font-size:12px; }

  .phasebar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-bottom:16px; }
  .phase { display:inline-flex; align-items:center; gap:0; }
  .phase .dot { width:7px; height:7px; border-radius:50%; background:var(--line); margin-right:7px;
                transition:background .2s; flex:none; }
  .phase.running .dot { background:var(--accent); animation:pulse 1s infinite; }
  .phase.done .dot { background:var(--ok); }
  .phase.failed .dot { background:var(--bad); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  #log { background:var(--logbg); color:var(--logink); border-radius:var(--radius-sm); padding:13px 14px;
         font:12px/1.6 var(--mono); font-variant-numeric:tabular-nums; height:220px; overflow:auto; white-space:pre-wrap;
         border:1px solid var(--line); }
  #log div { padding:1px 0; }
  #log .error { color:#ff9490; } #log .done { color:#79e0a3; }

  .table-wrap { overflow-x:auto; margin:2px -4px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
       border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  tbody tr:last-child td { border-bottom:none; }
  td.name { white-space:normal; font-weight:550; max-width:220px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }

  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600;
          border:1px solid var(--line); color:var(--muted); }
  .pill.on { background:var(--accent-weak); color:var(--accent-ink); border-color:transparent; }

  tr.rowsel { cursor:pointer; transition:background .1s; }
  tr.rowsel:hover td, tr.rowsel:focus-visible td { background:var(--accent-weak); }
  tr.rowsel:focus-visible { outline:none; }

  .files { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border:1px solid var(--line);
           border-radius:999px; font-size:12px; color:var(--ink); text-decoration:none; background:var(--panel-2);
           line-height:1.5; transition:border-color .12s, background .12s, color .12s; }
  .fchip:hover { border-color:var(--accent); color:var(--accent); }
  .fchip.key { border-color:transparent; background:var(--accent-weak); color:var(--accent-ink); font-weight:600; }
  .fchip.key:hover { background:var(--accent); color:#fff; }
  .fchip .ic { width:12px; height:12px; flex:none; }

  .result-head { display:flex; align-items:center; gap:9px; }
  .verdict { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:999px;
             font-size:12px; font-weight:650; }
  .verdict.pass { background:var(--ok-weak); color:var(--ok); }
  .verdict.fail { background:var(--bad-weak); color:var(--bad); }
  .verdict .dot2 { width:7px; height:7px; border-radius:50%; background:currentColor; }
  td.res-pass { color:var(--ok); font-weight:650; } td.res-fail { color:var(--bad); font-weight:650; }

  .trail-row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:6px 0;
               border-bottom:1px solid var(--line-2); font-size:12.5px; }
  .trail-row:last-child { border-bottom:none; }
  .trail-row .ev { font-weight:600; min-width:140px; }
  .trail-row .tx { font-family:var(--mono); color:var(--muted); }

  .muted { color:var(--muted); } .small { font-size:12px; }
  .err { color:var(--bad); font-size:12px; margin-top:10px; min-height:1.2em; }
  a { color:var(--accent); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dl" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.5v7m0 0 2.75-2.75M8 9.5 5.25 6.75M3 13h10"/>
  </symbol>
</svg>

<header>
  <h1>Research Election Console</h1>
  <span class="sub">Configure, run in phases, cross-check correctness — offline or on-chain.</span>
  <span class="tag">loopback</span>
</header>

<main>
  <!-- CONFIG -->
  <section class="panel" id="configPanel">
    <div class="phead"><h2>Election</h2></div>
    <label for="name">Election name</label>
    <input id="name" value="Demo Election" />

    <label>Trustees &amp; threshold</label>
    <div id="trustees"></div>
    <button class="small" id="addTrustee" type="button">+ add trustee</button>
    <div class="row" style="margin-top:10px">
      <div><label for="threshold">Threshold (t)</label><input id="threshold" type="number" min="1" value="2" class="tnum" /></div>
      <div><label>of trustees (n)</label><input id="nDisplay" disabled value="3" class="tnum" /></div>
    </div>

    <div class="row">
      <div><label for="positions">Positions</label><input id="positions" type="number" min="1" value="2" class="tnum" /></div>
      <div><label for="candidates">Candidates</label><input id="candidates" type="number" min="1" value="2" class="tnum" /></div>
    </div>

    <label for="voters">Voters (scale)</label>
    <input id="voters" type="number" min="1" value="10" class="tnum" />
    <div class="presets" id="presets"></div>

    <div class="row">
      <div><label for="distribution">Distribution</label>
        <select id="distribution"><option value="uniform">uniform</option><option value="skewed">skewed</option></select></div>
      <div><label for="mode">Mode</label>
        <select id="mode"><option value="offline">offline</option><option value="onchain">on-chain</option></select></div>
    </div>
    <div class="err" id="configErr"></div>
  </section>

  <!-- RUN + RESULTS -->
  <div class="col-run">
    <section class="panel">
      <div class="phead"><h2>Run</h2><span class="meta" id="runIdChip"></span></div>
      <div class="phasebar">
        <button class="primary" id="btnRunAll">▶ Run all</button>
        <span class="phase" data-phase="generate"><span class="dot"></span><button id="btnGenerate">Generate</button></span>
        <span class="phase" data-phase="submit"><span class="dot"></span><button id="btnSubmit">Submit</button></span>
        <span class="phase" data-phase="verify"><span class="dot"></span><button id="btnVerify">Verify</button></span>
        <span class="phase" data-phase="scenarios"><span class="dot"></span><button id="btnScenarios">Scenarios</button></span>
        <button class="small" id="btnCancel" disabled style="margin-left:auto">Cancel</button>
      </div>
      <div id="log" aria-live="polite"></div>
    </section>

    <section class="panel" id="resultsPanel" style="display:none">
      <div class="phead result-head"><h2>Correctness</h2><span id="overallChip"></span></div>
      <div class="table-wrap" id="results"></div>
      <div class="files" id="exports" style="margin-top:14px"></div>
    </section>

    <section class="panel" id="trailPanel" style="display:none">
      <div class="phead"><h2>Trail</h2><span class="meta small muted" id="trailStatus"></span></div>
      <div id="trailRows"><p class="muted small">Waiting for on-chain events…</p></div>
      <a id="trailLink" class="small" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px">Open public trail page &rarr;</a>
    </section>
  </div>

  <!-- HISTORY (full width) -->
  <section class="panel full">
    <div class="phead"><h2>History</h2><span class="meta small muted" id="histHint"></span></div>
    <div id="history"><p class="muted small">No runs yet — configure an election and press Run all.</p></div>
  </section>
</main>

<script>
"use strict";
// Logic-free view: this script only wires the DOM, POSTs config, streams SSE,
// and renders responses. ALL validation / run-state / correctness lives on the
// server (Go). No client-side t<=n check — the server is the gate.
const $ = (id) => document.getElementById(id);
const PRESETS = [1, 10, 100, 1000, 10000, 50000, 483000, 1000000];
const OFFLINE_CEILING = 10000;
// Data files: study CSVs first (prominent), then raw artifacts.
const FILE_ORDER = ["election.csv", "ballots.csv", "correctness.csv", "negative-tests.csv", "perf.csv",
                    "header.json", "ballots.ndjson", "run.json"];
const FILE_LABEL = { "election.csv":"election.csv", "ballots.csv":"ballots.csv",
                     "correctness.csv":"correctness.csv", "negative-tests.csv":"negatives.csv", "perf.csv":"perf.csv",
                     "header.json":"header.json (raw)", "ballots.ndjson":"ballots.ndjson (raw)", "run.json":"run.json (raw)" };
// Every .csv is study data → prominent; the raw audit/provenance files are quiet.
const STUDY = new Set(["election.csv", "ballots.csv", "correctness.csv", "negative-tests.csv", "perf.csv"]);
let currentRun = null, es = null, currentMode = "offline", runBusy = false, trailTimer = null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// --- operator Trail panel (onchain runs only; the public /trail page is the showpiece) ---
function truncMid(s, head, tail) {
  s = s || ""; head = head || 8; tail = tail || 6;
  return s.length <= head + tail + 1 ? s : s.slice(0, head) + "…" + s.slice(-tail);
}
function showTrailPanel(runID, mode) {
  currentMode = mode;
  $("trailPanel").style.display = mode === "onchain" ? "block" : "none";
  $("trailLink").href = "/trail/" + encodeURIComponent(runID);
}
function eventTimeShortText(ts) {
  // Go zero time marshals as "0001-01-01T00:00:00Z" when absent; treat any
  // implausibly old year as absent.
  if (!ts) return "";
  const d = new Date(ts);
  if (isNaN(d.getTime()) || d.getFullYear() < 2000) return "";
  return d.toLocaleTimeString();
}
function renderTrailRows(events) {
  const box = $("trailRows");
  if (!events || !events.length) { box.innerHTML = '<p class="muted small">Waiting for on-chain events…</p>'; return; }
  box.innerHTML = "";
  events.forEach((ev) => {
    const r = ev.receipt || {};
    const row = document.createElement("div"); row.className = "trail-row";
    const a = document.createElement("span"); a.className = "ev"; a.textContent = ev.event || "";
    const b = document.createElement("span"); b.textContent = ev.ref || "";
    const c = document.createElement("span"); c.textContent = "block #" + (r.BlockNumber ?? "?");
    const d = document.createElement("span"); d.className = "tx"; d.textContent = truncMid(r.TxID || "");
    row.append(a, b, c, d);
    const timeText = eventTimeShortText(r.Timestamp);
    if (timeText) {
      const e = document.createElement("span"); e.className = "muted"; e.textContent = timeText;
      row.append(e);
    }
    box.append(row);
  });
}
async function loadTrail(runID) {
  try {
    const res = await fetch(`/api/trail/${encodeURIComponent(runID)}?operator=1`);
    if (!res.ok) return;
    const data = await res.json();
    $("trailStatus").textContent = data.sealed ? (data.status || "") : ((data.live && data.live.status_now) || "");
    renderTrailRows(data.events);
  } catch (_) {}
}
function stopTrailPoll() { if (trailTimer) { clearInterval(trailTimer); trailTimer = null; } }
function startTrailPoll(runID) {
  stopTrailPoll();
  if (currentMode !== "onchain" || document.hidden) return;
  loadTrail(runID);
  trailTimer = setInterval(() => loadTrail(runID), 3000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopTrailPoll();
  else if (runBusy && currentRun) startTrailPoll(currentRun);
});

function fileChips(runID, arts) {
  if (!arts || !arts.length) return '<span class="muted small">— run a phase to produce data —</span>';
  return FILE_ORDER.filter((a) => arts.includes(a)).map((a) =>
    `<a class="fchip${STUDY.has(a) ? " key" : ""}" href="/export/${runID}/${a}" download title="download ${a}">`
    + `<svg class="ic"><use href="#i-dl"/></svg>${FILE_LABEL[a] || a}</a>`).join("");
}

function renderTrustees(names) {
  const box = $("trustees"); box.innerHTML = "";
  names.forEach((nm) => {
    const row = document.createElement("div"); row.className = "trustee";
    const inp = document.createElement("input"); inp.value = nm; inp.dataset.trustee = "1";
    const del = document.createElement("button"); del.textContent = "×"; del.className = "small"; del.type = "button";
    del.title = "remove trustee";
    del.onclick = () => { inp.parentElement.remove(); syncN(); };
    row.append(inp, del); box.append(row);
  });
  syncN();
}
function trusteeNames() { return [...document.querySelectorAll('[data-trustee]')].map((i) => i.value); }
function syncN() { $("nDisplay").value = document.querySelectorAll('[data-trustee]').length; }

function renderPresets() {
  const box = $("presets"); box.innerHTML = "";
  const offline = $("mode").value === "offline";
  PRESETS.forEach((n) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "tnum"; b.textContent = n.toLocaleString();
    const blocked = offline && n > OFFLINE_CEILING;
    b.disabled = blocked; if (blocked) b.title = "on-chain / perf mode only";
    b.onclick = () => { $("voters").value = n; };
    box.append(b);
  });
}

function config() {
  return {
    name: $("name").value,
    trustees: trusteeNames().map((n) => ({ name: n })),
    threshold: +$("threshold").value,
    positions: +$("positions").value,
    candidates: +$("candidates").value,
    voters: +$("voters").value,
    distribution: $("distribution").value,
    mode: $("mode").value,
  };
}

function log(msg, cls) {
  const el = $("log"); const line = document.createElement("div");
  if (cls) line.className = cls; line.textContent = msg;
  el.append(line); el.scrollTop = el.scrollHeight;
}
function setPhase(phase, state) {
  const el = document.querySelector(`.phase[data-phase="${phase}"]`);
  if (el) el.className = "phase " + state;
}
function resetPhases() { ["generate","submit","verify","scenarios"].forEach((p) => setPhase(p, "")); }

function openStream(runID) {
  if (es) es.close();
  es = new EventSource("/events?run=" + encodeURIComponent(runID));
  es.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    log(`[${e.phase}] ${e.msg}`, e.level);
    if (e.level === "done") setPhase(e.phase, "done");
    else if (e.level === "error") setPhase(e.phase, "failed");
    else setPhase(e.phase, "running");
    if (e.phase === "verify" && e.level === "done") loadResults(runID);
    if ((e.phase === "scenarios") && (e.level === "done" || e.level === "error")) loadHistory();
    if (e.level === "done" || e.level === "error") {
      $("btnCancel").disabled = false;
      runBusy = false;
      stopTrailPoll();
      if (currentMode === "onchain") loadTrail(runID); // one final fetch
    }
  };
}

async function post(path, body) {
  $("configErr").textContent = "";
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) { const t = await res.text(); $("configErr").textContent = t.trim(); throw new Error(t); }
  return res.json();
}

async function startWithConfig(path) {
  resetPhases(); $("resultsPanel").style.display = "none"; $("log").innerHTML = "";
  const cfg = config();
  try {
    const { run_id } = await post(path, cfg);
    currentRun = run_id; $("runIdChip").textContent = run_id;
    $("btnCancel").disabled = false;
    showTrailPanel(run_id, cfg.mode);
    runBusy = true;
    startTrailPoll(run_id);
    openStream(run_id);
  } catch (_) {}
}
async function phase(path) {
  if (!currentRun) { $("configErr").textContent = "Generate a run first."; return; }
  try {
    await post(path, { run_id: currentRun });
    runBusy = true;
    startTrailPoll(currentRun);
  } catch (_) {}
}

async function artifactsFor(runID) {
  try {
    const recs = await (await fetch("/runs")).json();
    const rec = recs.find((r) => r.run_id === runID);
    return rec ? (rec.artifacts || []) : [];
  } catch (_) { return []; }
}

async function loadResults(runID) {
  try {
    const res = await fetch(`/export/${runID}/correctness.csv`);
    if (!res.ok) return;
    const rows = (await res.text()).trim().split("\n").slice(1).map((r) => r.split(","));
    let pass = true;
    let html = '<table><thead><tr><th>Contest</th><th class="num">Ground truth</th><th class="num">Decoded</th><th class="num">E</th><th>Result</th></tr></thead><tbody>';
    rows.forEach(([c, gt, dec, e, p]) => {
      const ok = p === "true"; if (!ok) pass = false;
      html += `<tr><td class="name">${esc(c)}</td><td class="num">${esc(gt)}</td><td class="num">${esc(dec)}</td>`
            + `<td class="num">${esc(e)}</td><td class="${ok ? "res-pass" : "res-fail"}">${ok ? "PASS" : "FAIL"}</td></tr>`;
    });
    $("results").innerHTML = html + "</tbody></table>";
    const chip = $("overallChip");
    chip.className = "verdict " + (pass ? "pass" : "fail");
    chip.innerHTML = `<span class="dot2"></span>${pass ? "E = 0 · PASS" : "FAIL"}`;
    $("exports").innerHTML = fileChips(runID, await artifactsFor(runID));
    $("resultsPanel").style.display = "block";
    loadHistory();
  } catch (_) {}
}

async function loadHistory() {
  try {
    const recs = await (await fetch("/runs")).json();
    if (!recs.length) {
      $("history").innerHTML = '<p class="muted small">No runs yet — configure an election and press Run all.</p>';
      $("histHint").textContent = ""; return;
    }
    $("histHint").textContent = "click a row to view its correctness";
    let html = '<div class="table-wrap"><table><thead><tr>'
      + '<th>Election</th><th class="num">Scale</th><th>t-of-n</th><th>Mode</th><th>When</th><th>Data files</th>'
      + '</tr></thead><tbody>';
    recs.forEach((r) => {
      const c = r.config, arts = r.artifacts || [];
      const canLoad = arts.includes("correctness.csv");
      const mode = c.mode === "onchain" ? '<span class="pill on">on-chain</span>' : '<span class="pill">offline</span>';
      html += `<tr class="${canLoad ? "rowsel" : ""}"${canLoad ? ` data-run="${esc(r.run_id)}" data-mode="${esc(c.mode)}" tabindex="0"` : ""}>`
            + `<td class="name">${esc(c.name)}</td>`
            + `<td class="num">${c.voters.toLocaleString()}</td>`
            + `<td class="tnum">${c.threshold}-of-${c.trustees.length}</td>`
            + `<td>${mode}</td>`
            + `<td class="muted tnum">${new Date(r.created_at).toLocaleString()}</td>`
            + `<td><div class="files">${fileChips(r.run_id, arts)}</div></td></tr>`;
    });
    $("history").innerHTML = html + "</tbody></table></div>";
    // Click / Enter a row that has results to load its correctness (links still download).
    document.querySelectorAll('#history tr[data-run]').forEach((tr) => {
      const open = (ev) => {
        if (ev.target.closest("a")) return;
        const id = tr.dataset.run;
        currentRun = id; $("runIdChip").textContent = id;
        loadResults(id);
        showTrailPanel(id, tr.dataset.mode);
        if (tr.dataset.mode === "onchain") { runBusy = false; stopTrailPoll(); loadTrail(id); }
        $("resultsPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
      };
      tr.addEventListener("click", open);
      tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(ev); } });
    });
  } catch (_) {}
}

// --- wiring ---
$("addTrustee").onclick = () => { const n = trusteeNames(); n.push("Trustee " + (n.length + 1)); renderTrustees(n); };
$("mode").onchange = renderPresets;
$("btnRunAll").onclick = () => startWithConfig("/run-all");
$("btnGenerate").onclick = () => startWithConfig("/generate");
$("btnSubmit").onclick = () => phase("/submit");
$("btnVerify").onclick = () => phase("/verify");
$("btnScenarios").onclick = () => { if (currentRun) post("/scenarios", { run_id: currentRun, list: [] }).catch(() => {}); else $("configErr").textContent = "Generate a run first."; };
$("btnCancel").onclick = () => { if (currentRun) post("/cancel", { run_id: currentRun }).catch(() => {}); };

renderTrustees(["Trustee 1", "Trustee 2", "Trustee 3"]);
renderPresets();
loadHistory();
</script>
</body>
</html>
