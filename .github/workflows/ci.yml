name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GO_MODULES: |
    packages/saksi-protocol/go
    packages/saksi-bulletin/chaincode
    packages/saksi-bulletin/client-sdk
    packages/saksi-campaign
  # Allow Go to fetch and write missing go.sum entries during CI. The repo
  # is in early scaffold and not all modules have committed go.sum yet.
  GOFLAGS: -mod=mod

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            packages/saksi-protocol/go/go.mod
            packages/saksi-bulletin/chaincode/go.mod
            packages/saksi-bulletin/client-sdk/go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint Go modules
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            files="$(gofmt -l "${module}")"
            if [ -n "${files}" ]; then
              echo "${files}"
              exit 1
            fi
            (cd "${module}" && go vet ./...)
            (cd "${module}" && "$(go env GOPATH)/bin/staticcheck" ./...)
          done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        # Includes the saksi-demo gen->audit-stream integration test
        # (tests/gen_audit_stream.rs) — the Rust<->Go contract gate for the
        # Research Election Console: it runs the real binary end-to-end.
        run: cargo test --workspace

      # The campaign module's cross-language tests (ledger dump -> audit-stream,
      # scenario mutations) shell out to the real saksi-demo. findDemo in
      # packages/saksi-campaign locates it via SAKSI_DEMO_BIN, else
      # target/{release,debug}/saksi-demo, else PATH — and SKIPS when it finds
      # none. Building it and naming it is what makes those tests actually run
      # here instead of silently skipping.
      - name: Build saksi-demo for the Go cross-language tests
        run: cargo build --release -p saksi-demo

      - name: Point the Go tests at saksi-demo
        shell: bash
        run: echo "SAKSI_DEMO_BIN=${GITHUB_WORKSPACE}/target/release/saksi-demo" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            packages/saksi-protocol/go/go.mod
            packages/saksi-bulletin/chaincode/go.mod
            packages/saksi-bulletin/client-sdk/go.mod

      # -race, not plain `go test`: the campaign console fans out goroutines in
      # business logic (the ballot window's workers, and the post-window partial
      # decryptions), and a data race there would corrupt receipts or the trail
      # without ever failing a test. Both hosted runners ship a C toolchain, so
      # cgo — which the race detector requires — is available on each.
      - name: Test Go modules
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            (cd "${module}" && CGO_ENABLED=1 go test -race ./...)
          done

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Rust workspace
        run: cargo build --workspace --release

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            packages/saksi-protocol/go/go.mod
            packages/saksi-bulletin/chaincode/go.mod
            packages/saksi-bulletin/client-sdk/go.mod

      - name: Build Go modules
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            (cd "${module}" && go build ./...)
          done

  security:
    name: Security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            packages/saksi-protocol/go/go.mod
            packages/saksi-bulletin/chaincode/go.mod
            packages/saksi-bulletin/client-sdk/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

        # govulncheck is advisory: the Hyperledger Fabric chaincode and client
        # SDK drag in heavy transitive dependencies (grpc, golang.org/x/net)
        # whose advisories are not reachable from first-party code
        # ("your code is affected by 0 vulnerabilities"). We keep the scan
        # visible in CI but do not fail the build on transitive-only Go
        # advisories we cannot fix without forking Fabric's dependency tree.
        # cargo audit (above) and all other gates remain blocking.
      - name: Run govulncheck (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for module in ${GO_MODULES}; do
            (cd "${module}" && "$(go env GOPATH)/bin/govulncheck" ./...)
          done
